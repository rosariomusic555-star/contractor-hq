
[functions.assistant-chat]
enabled = true
# Platform verifies the caller's Supabase JWT before invoking the function at
# all; the function itself also re-derives the user from that same JWT to
# build an RLS-scoped Supabase client (belt-and-suspenders — see index.ts).
verify_jwt = true
import_map = "./functions/assistant-chat/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/assistant-chat/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/assistant-chat/*.html" ]

[functions.create-employee]
enabled = true
# Same belt-and-suspenders as assistant-chat: platform verifies the JWT
# before invoking at all; the function re-derives the caller from it too,
# and only steps up to the service-role key after confirming the caller is
# an owner (see index.ts).
verify_jwt = true
import_map = "./functions/create-employee/deno.json"
entrypoint = "./functions/create-employee/index.ts"

[functions.portal-request-link]
enabled = true
# Public entry point — there is no signed-in caller at all yet (this IS the
# sign-in request). The function does its own email-match + rate-limit
# gating server-side before ever touching Supabase Auth's own OTP endpoint.
verify_jwt = false
import_map = "./functions/portal-request-link/deno.json"
entrypoint = "./functions/portal-request-link/index.ts"
